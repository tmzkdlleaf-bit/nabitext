# 설치 파일 빌드: Windows(.exe), macOS(.dmg + 업데이트용 .zip), Linux(.AppImage), 그리고 Microsoft Store용(.appx, 설정했을 때만)
#
# 실행 방법
#   - Actions 탭 → build → Run workflow: 설치 파일만 만든다(Artifacts에서 내려받기). 자동 업데이트 주소는 넣지 않는다.
#   - v로 시작하는 태그(v0.12.0 등)를 올리면: 설치 파일 + 자동 업데이트 파일(latest*.yml)을 이 저장소의 GitHub Releases에
#     '초안(draft)'으로 올린다. 초안을 확인하고 Publish release를 누르면 설치한 앱들이 새 버전을 받기 시작한다.
#
# 서명(없으면 서명 없이 만든다. README "설치 파일·서명·자동 업데이트" 참고)
#   저장소 Settings → Secrets and variables → Actions → Secrets에 넣으면 자동으로 쓰인다.
#   Windows(인증서 파일 .pfx): WIN_CSC_LINK(파일을 base64로 바꾼 글자), WIN_CSC_KEY_PASSWORD
#   macOS(Apple 개발자 프로그램): MAC_CSC_LINK(Developer ID Application .p12의 base64), MAC_CSC_KEY_PASSWORD,
#                                APPLE_API_KEY_P8(App Store Connect API 키 .p8 내용), APPLE_API_KEY_ID, APPLE_API_ISSUER → 서명 + 공증
#   Microsoft Store(인증서 필요 없음 — 스토어가 서명): Variables에 STORE_IDENTITY_NAME, STORE_PUBLISHER, STORE_PUBLISHER_NAME
#                                (Partner Center의 앱 ID 정보)를 넣으면 .appx도 만든다. 스토어에 올리는 것은 Partner Center에서 직접.
name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write # 태그 빌드가 Releases 초안을 만든다
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: dist/*.exe
          - os: macos-latest
            target: --mac
            files: |
              dist/*.dmg
              dist/*.zip
          - os: ubuntu-latest
            target: --linux
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apple API 키 파일(공증용, 있을 때만)
        if: runner.os == 'macOS'
        shell: bash
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$KEY" ]; then echo '공증 키 없음: 서명·공증 없이 빌드'; exit 0; fi
          mkdir -p ~/private_keys
          printf '%s' "$KEY" > ~/private_keys/AuthKey.p8
          echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
      - name: 빌드
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "$APPLE_API_KEY_ID" ]; then unset APPLE_API_KEY_ID APPLE_API_ISSUER; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # 태그: 자동 업데이트 주소(이 저장소의 Releases)를 넣고 초안 릴리스에 올린다
            npx electron-builder ${{ matrix.target }} --publish always \
              -c.publish.provider=github -c.publish.owner="${GITHUB_REPOSITORY%%/*}" -c.publish.repo="${GITHUB_REPOSITORY#*/}" -c.publish.releaseType=draft
          else
            npx electron-builder ${{ matrix.target }} --publish never
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Microsoft Store용 패키지. 저장소 Variables에 STORE_IDENTITY_NAME이 있을 때만
  store:
    if: vars.STORE_IDENTITY_NAME != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win appx --publish never -c.appx.identityName="${{ vars.STORE_IDENTITY_NAME }}" -c.appx.publisher="${{ vars.STORE_PUBLISHER }}" -c.appx.publisherDisplayName="${{ vars.STORE_PUBLISHER_NAME }}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: store-appx
          path: dist/*.appx
          if-no-files-found: error
