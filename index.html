<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나비텍스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Nanum+Pen+Script&family=Black+Han+Sans&family=Do+Hyeon&family=Song+Myung&family=Hahmlet:wght@400;600;700&family=Diphylleia&family=Gasoek+One&family=Bagel+Fat+One&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">

  <!-- 상단 바 -->
  <header class="topbar">
    <button class="icon-btn" id="btn-docs" title="문서 목록 (Ctrl+Shift+O)" aria-label="문서 목록"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <div class="brand"><span class="brand-mark">◆</span> 나비텍스트</div>
    <input class="doc-title" id="doc-title" placeholder="제목 없는 문서" aria-label="문서 제목">
    <span class="save-state" id="save-state">저장됨</span>
    <div class="spacer"></div>
    <div class="seg" role="tablist" aria-label="보기 모드">
      <button class="seg-btn active" data-mode="edit">편집</button>
      <button class="seg-btn" data-mode="read">미리보기</button>
      <button class="seg-btn" data-mode="poster">글 이미지</button>
      <button class="seg-btn" data-mode="cards">카드뉴스</button>
    </div>
    <button class="icon-btn" id="btn-undo" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="icon-btn" id="btn-redo" title="다시 실행 (Ctrl+Shift+Z)" aria-label="다시 실행"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button class="icon-btn" id="btn-focus" title="포커스 모드 (Ctrl+.)" aria-label="포커스 모드"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg></button>
    <button class="icon-btn" id="btn-ui-theme" title="화면 밝기 전환" aria-label="화면 밝기 전환"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
    <div class="menu-wrap">
      <button class="btn primary" id="btn-export" aria-label="내보내기"><span class="label">내보내기 ▾</span><svg class="only-narrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
      <div class="dropdown" id="export-menu" hidden>
        <button data-export="copy-rich">서식 포함 복사 <small>블로그·메일에 붙여넣기</small></button>
        <button data-export="html">HTML 파일</button>
        <button data-export="md">Markdown 파일</button>
        <button data-export="txt">텍스트 파일</button>
        <button data-export="pdf">PDF로 인쇄</button>
        <hr>
        <button data-export="open">파일 열기… <small>.md .txt .html</small></button>
      </div>
    </div>
    <button class="icon-btn" id="btn-panel" title="디자인 패널" aria-label="디자인 패널 열기/닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg></button>
  </header>

  <!-- 문서 목록 -->
  <aside class="sidebar" id="sidebar" hidden>
    <div class="sidebar-head">
      <strong>문서</strong>
      <button class="btn small" id="btn-new">+ 새 문서</button>
    </div>
    <ul class="doc-list" id="doc-list"></ul>
  </aside>

  <!-- 작업 영역 -->
  <main class="workspace" id="workspace">
    <div class="page-wrap" id="page-wrap">
      <article class="page nt-page" id="page">
        <div class="editor nt-doc" id="editor" contenteditable="true" spellcheck="false"
             aria-label="본문" data-placeholder="여기에 글을 쓰세요. ‘/’를 누르면 블록을 넣을 수 있어요."></div>
      </article>
    </div>
    <div class="cards-wrap" id="cards-wrap" hidden>
      <div class="cards-toolbar">
        <label>비율
          <select id="card-ratio">
            <option value="1:1">1:1 정사각</option>
            <option value="4:5">4:5 세로</option>
            <option value="9:16">9:16 스토리</option>
          </select>
        </label>
        <label>배경
          <select id="card-bg">
            <option value="theme">테마 그대로</option>
            <option value="accent">강조색</option>
            <option value="gradient">그라데이션</option>
            <option value="paper">종이</option>
          </select>
        </label>
        <label>정렬
          <select id="card-align">
            <option value="center">가운데</option>
            <option value="top">위쪽</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="card-num" checked> 쪽 번호</label>
        <span class="hint">구분선(—)으로 카드를 나눕니다</span>
        <div class="spacer"></div>
        <button class="btn primary" id="btn-cards-png">모두 PNG로 저장</button>
      </div>
      <div class="cards" id="cards"></div>
    </div>
    <div class="poster-wrap" id="poster-wrap" hidden>
      <div class="pp-main">
        <div class="pp-toolbar">
          <div class="seg small" id="pp-tools" role="toolbar" aria-label="편집 도구">
            <button class="seg-btn active" data-tool="deco">선택·옮기기</button>
            <button class="seg-btn" data-tool="text">글 영역</button>
            <button class="seg-btn" data-tool="bg">배경 옮기기</button>
            <button class="seg-btn" data-tool="insert">이미지 넣기</button>
          </div>
          <label>보기 <select id="pp-zoom"><option value="fit">화면에 맞춤</option><option value="0.5">50%</option><option value="1">100%</option></select></label>
          <span class="hint" id="pp-info"></span>
          <span class="pp-hint" id="pp-hint"></span>
          <div class="spacer"></div>
          <label>해상도 <select id="pp-ratio"><option value="1">원본 크기</option><option value="2">2배 (선명하게)</option></select></label>
          <button class="btn primary" id="pp-export">PNG로 저장</button>
        </div>
        <div class="pp-stage" id="pp-stage"></div>
      </div>
      <aside class="pp-panel" id="pp-panel"></aside>
    </div>
  </main>

  <!-- 오른쪽 패널 -->
  <aside class="panel" id="panel">
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="design">디자인</button>
      <button class="tab" data-tab="tidy">다듬기</button>
      <button class="tab" data-tab="check">점검</button>
    </div>

    <!-- 디자인 -->
    <section class="tab-body" data-tab-body="design">
      <h3>테마</h3>
      <div class="theme-grid" id="theme-grid"></div>

      <h3>글꼴</h3>
      <label class="row">본문 <select id="d-font-body"></select></label>
      <label class="row">제목 <select id="d-font-head"></select></label>

      <h3>조판</h3>
      <label class="slider">글자 크기 <output id="o-fs"></output>
        <input type="range" id="d-fs" min="13" max="24" step="0.5"></label>
      <label class="slider">행간 <output id="o-lh"></output>
        <input type="range" id="d-lh" min="1.3" max="2.3" step="0.05"></label>
      <label class="slider">자간 <output id="o-ls"></output>
        <input type="range" id="d-ls" min="-0.06" max="0.1" step="0.005"></label>
      <label class="slider">문단 간격 <output id="o-pg"></output>
        <input type="range" id="d-pg" min="0" max="2.4" step="0.1"></label>
      <label class="slider">본문 폭 <output id="o-w"></output>
        <input type="range" id="d-w" min="420" max="960" step="10"></label>

      <div class="row">정렬
        <div class="seg small">
          <button class="seg-btn" data-align="left">왼쪽</button>
          <button class="seg-btn" data-align="justify">양쪽</button>
        </div>
      </div>

      <h3>강조색</h3>
      <div class="swatches" id="swatches"></div>

      <h3>세부</h3>
      <label class="check"><input type="checkbox" id="d-indent"> 문단 첫 줄 들여쓰기</label>
      <label class="check"><input type="checkbox" id="d-dropcap"> 첫 글자 크게 (드롭캡)</label>
      <label class="check"><input type="checkbox" id="d-keepall"> 어절 단위 줄바꿈 (keep-all)</label>
      <label class="check"><input type="checkbox" id="d-balance"> 제목 줄 길이 균형 맞추기</label>
      <button class="btn small ghost" id="btn-reset-design">테마 기본값으로 되돌리기</button>
    </section>

    <!-- 다듬기 -->
    <section class="tab-body" data-tab-body="tidy" hidden>
      <p class="desc">붙여넣은 글의 공백·문장부호를 한 번에 정리합니다. 서식은 그대로 유지돼요.</p>
      <ul class="tidy-list" id="tidy-list"></ul>
      <div class="tidy-actions">
        <button class="btn primary" id="btn-tidy">선택한 규칙 적용</button>
        <span class="muted" id="tidy-total"></span>
      </div>
      <p class="desc small">적용 후에도 Ctrl+Z로 되돌릴 수 있습니다.</p>
    </section>

    <!-- 점검 -->
    <section class="tab-body" data-tab-body="check" hidden>
      <div class="stats" id="stats"></div>
      <label class="check"><input type="checkbox" id="c-highlight" checked> 본문에 점검 결과 표시</label>
      <h3>문장 길이</h3>
      <div class="legend">
        <span><i class="lg warn"></i> 70자 초과</span>
        <span><i class="lg bad"></i> 100자 초과</span>
      </div>
      <ul class="issue-list" id="long-list"></ul>
      <h3>군더더기·번역투 표현</h3>
      <ul class="issue-list" id="phrase-list"></ul>
      <h3>자주 반복한 낱말</h3>
      <div class="chips" id="repeat-list"></div>
    </section>
  </aside>
</div>

<!-- 플로팅 서식 툴바 -->
<div class="bubble" id="bubble" hidden>
  <select id="bubble-block" title="블록 종류">
    <option value="p">본문</option>
    <option value="h1">제목 1</option>
    <option value="h2">제목 2</option>
    <option value="h3">제목 3</option>
    <option value="blockquote">인용</option>
  </select>
  <button data-cmd="bold" title="굵게 (Ctrl+B)"><b>B</b></button>
  <button data-cmd="italic" title="기울임 (Ctrl+I)"><i>I</i></button>
  <button data-cmd="underline" title="밑줄 (Ctrl+U)"><u>U</u></button>
  <button data-cmd="strikeThrough" title="취소선"><s>S</s></button>
  <button data-cmd="mark" title="형광펜 (Ctrl+Shift+H)"><span class="hl">H</span></button>
  <button data-cmd="accent" title="강조색 글자"><span class="ac">A</span></button>
  <button data-cmd="code" title="코드">&lt;/&gt;</button>
  <button data-cmd="link" title="링크 (Ctrl+K)">🔗</button>
  <button data-cmd="clear" title="서식 지우기">⌫</button>
</div>

<!-- 슬래시 메뉴 -->
<div class="slash" id="slash" hidden role="listbox"></div>

<!-- 알림 -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<input type="file" id="file-open" accept=".md,.markdown,.txt,.html,.htm" hidden>
<input type="file" id="file-image" accept="image/*" hidden>
<input type="file" id="pp-file" accept="image/*" hidden>
<input type="file" id="pp-bgfile" accept="image/*" hidden>
<input type="file" id="pp-figfile" accept="image/*" hidden>

<script src="vendor/html-to-image.js"></script>
<script src="js/doc-style.js"></script>
<script src="js/themes.js"></script>
<script src="js/util.js"></script>
<script src="js/dialog.js"></script>
<script src="js/storage.js"></script>
<script src="js/history.js"></script>
<script src="js/tidy.js"></script>
<script src="js/analyze.js"></script>
<script src="js/convert.js"></script>
<script src="js/editor.js"></script>
<script src="js/design.js"></script>
<script src="js/cards.js"></script>
<script src="js/poster-assets.js"></script>
<script src="js/poster.js"></script>
<script src="js/app.js"></script>
</body>
</html>
